<html >
<head>
    <title>Flexbox</title>

    <style>
        div{
            width: 100px;
            height: 100px;
            border: 1px solid black;
            background-color: deepskyblue;

            flex-grow: 0;
        }

        main{
            display: flex;

            flex-direction: row;

            /* flex-wrap: wrap; */

            height: 100vh;

            justify-content: center;
            align-items: center;
        }

        body{
            margin: 0;
        }
    </style>
</head>
<body>
    <main>
        <div>1</div>
        <div style="align-self: flex-start;">2</div>
        <div style="background-color: bisque; flex-grow: 5; order: 6; align-self: flex-end;">3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>

    </main>
</body>
</html>
