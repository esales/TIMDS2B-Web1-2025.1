<!DOCTYPE html>
<html>
<head>
    <title>Seletores</title>

    <style>
        h1 span{
            color: red;
        }

        body > p{
            color: green;
        }


    </style>

</head>
<body>
    <h1>Texto do <span>H1</span></h1>
    <h2>Texto do primeiro <span>H2</span></h2>
    <p>Texto do primeiro <span>parágrafo</span></p>
    <h2>Texto do Segundo <span>H2</span></h2>
    <p>Texto do Segundo <span>parágrafo</span></p>


    <div>
        <p>Texto do parágrafo da div!</p>
    </div>

</body>
</html>
