<html>
<head>
    <title>Grid</title>

   <style>
        body{
            margin: 0;
            height: 100vh;

            display: grid;

            grid-template-columns: 3fr 2fr 5fr;
            grid-template-rows: 3fr 2fr 1fr;
            
        }

        .amarela{
            background-color: yellow;
        }
        .cinza{
            background-color: gray;
        }

   </style>
</head>
<body>
    <div class="amarela"></div>
    <div class="cinza"></div>
    <div class="amarela"></div>
    <div class="cinza"></div>
    <div class="amarela"></div>
    <div class="cinza"></div>
    <div class="amarela"></div>
    <div class="cinza"></div>
    <div class="amarela"></div>
</body>
</html>
