<html>
<head>
    <title>Grid</title>

    <style>
        body{
            margin: 0;

            display: grid;

            grid-template-columns: 1fr 2fr 1fr 3fr 5fr;
            grid-template-rows: 2fr 1fr 3fr;

            height: 100vh;
        }

        .azul {
            background-color: blue;
        }

        .verde{
            background-color: green;
        }

        .cinza{
            background-color: gray;
        }

        .vermelho{
            background-color: red;
        }

        .amarelo{
            background-color: yellow;
        }

    </style>
</head>
<body>
    <div class="azul"></div>
    <div class="verde"></div>
    <div class="vermelho"></div>
    <div class="cinza"></div>
    <div class="amarelo"></div>
    <div class="verde"></div>
    <div class="vermelho"></div>
    <div class="cinza"></div>
    <div class="amarelo"></div>
    <div class="azul"></div>
    <div class="vermelho"></div>
    <div class="cinza"></div>
    <div class="amarelo"></div>
</body>
</html>
