<html>
<head>
    <title>Grid</title>

    <style>
        body{
            margin: 0;

            display: grid;

            height: 100vh;

            grid-template-rows: 1fr 3fr 1fr;

            grid-template-areas:
            "h h h h h"
            "n m m m m"
            "f f f f f"
        }

        header{
            grid-area: h;
            background-color: lightblue;
        }

        nav{
            grid-area: n;
            background-color: lightgreen;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        main{
            grid-area: m;
            background-color: lightcoral;
        }

        footer{
            grid-area: f;
            background-color: lightgray;
        }

        .botao{
            background-color: black;
            color:white;
            width: 50%;
            height: 25px;
            margin:3px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>Cabeçalho</header>
    <nav>
        <div class="botao">1</div>
        <div class="botao">2</div>
        <div class="botao">3</div>
    </nav>
    <main>
        Conteúdo principal
    </main>
    <footer>Rodapé</footer>
</body>
</html>
