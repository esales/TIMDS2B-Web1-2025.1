<html>
<head>
    <title>Seletores</title>

    <style>
        body{
            background-color: gray;
        }

        * {
            color:palegreen;
            font-size: 45px;
        }

        h2 {
            color:darkblue;
        }

        #tituloTipo {
            color:hotpink;
        }
    </style>
</head>
<body>
    <h1>Seletores</h1>
    <h2>Seletor Universal</h2>
    <p>O seletor universal é representado por um asterisco (*) e aplica-se a todos os elementos da página.</p>
    <h2 id="tituloTipo">Seletor de Tipo</h2>
    <p>O seletor de tipo aplica-se a todos os elementos de um determinado tipo. Por exemplo, o seletor <code>p</code> aplica-se a todos os parágrafos.</p>
</body>
</html>
